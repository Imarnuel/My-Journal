<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F2F2F4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0C0E" media="(prefers-color-scheme: dark)" />
    <title>Journal</title>
    <script>
      // Resolve the theme before first paint (Settings > Appearance: system | light | dark). System falls back to light.
      (function () {
        try {
          var q = new URLSearchParams(location.search).get("theme");
          var pref = q || localStorage.getItem("appearance") || "light";
          var dark = pref === "dark" || (pref === "system" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
